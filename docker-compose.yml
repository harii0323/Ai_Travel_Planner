services:
  backend:
    build:
      context: ./backend
    image: ai-travel-planner-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.docker
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
    image: ai-travel-planner-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
