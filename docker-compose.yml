services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_travel_planner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # In production, bind DB to host loopback only for administrative migrations
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    expose:
      - "5432"
    networks:
      - db_isolated_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ai_travel_planner}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: ai-travel-planner-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: ./backend/.env.docker
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Runtime least-privilege application role (NOSUPERUSER, NOBYPASSRLS)
      DATABASE_URL: ${DATABASE_URL:-postgres://travel_app_runtime:CHANGE_IN_PRODUCTION_SECRET@postgres:5432/ai_travel_planner}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_isolated_net
      - app_internal_net
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    image: ai-travel-planner-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_internal_net
    ports:
      - "${FRONTEND_PORT:-80}:80"

networks:
  # Internal network connecting frontend to backend API
  app_internal_net:
    driver: bridge
  # Isolated database network: only backend and postgres can access (frontend is isolated)
  db_isolated_net:
    driver: bridge

volumes:
  postgres_data:
